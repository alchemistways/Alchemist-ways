name: Build GitHub Pages into main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pages:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: rebuild GitHub Pages root') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
      - name: Commit generated root site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f index.html 404.html assets CNAME .nojekyll favicon.png apple-touch-icon.png og-image.jpg robots.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild GitHub Pages root"
          git push origin main